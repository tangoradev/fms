<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background elements -->
  <circle cx="400" cy="300" r="250" fill="#ffffff" opacity="0.1"/>
  <circle cx="400" cy="300" r="200" fill="#ffffff" opacity="0.15"/>
  <circle cx="400" cy="300" r="150" fill="#ffffff" opacity="0.2"/>
  
  <!-- Road -->
  <rect x="100" y="400" width="600" height="40" rx="5" fill="#555555"/>
  <rect x="100" y="420" width="600" height="20" rx="5" fill="#333333"/>
  
  <!-- Road markings -->
  <rect x="150" y="418" width="60" height="4" fill="#ffffff"/>
  <rect x="250" y="418" width="60" height="4" fill="#ffffff"/>
  <rect x="350" y="418" width="60" height="4" fill="#ffffff"/>
  <rect x="450" y="418" width="60" height="4" fill="#ffffff"/>
  <rect x="550" y="418" width="60" height="4" fill="#ffffff"/>
  <rect x="650" y="418" width="60" height="4" fill="#ffffff"/>
  
  <!-- Car 1 - Sedan -->
  <g transform="translate(180, 360) scale(0.8)">
    <!-- Car body -->
    <rect x="20" y="40" width="160" height="30" rx="10" fill="#3498db"/>
    <rect x="40" y="10" width="120" height="30" rx="15" fill="#3498db"/>
    <!-- Windows -->
    <rect x="50" y="15" width="40" height="20" rx="5" fill="#d6eaf8"/>
    <rect x="100" y="15" width="40" height="20" rx="5" fill="#d6eaf8"/>
    <!-- Wheels -->
    <circle cx="50" cy="70" r="15" fill="#333333"/>
    <circle cx="50" cy="70" r="8" fill="#666666"/>
    <circle cx="150" cy="70" r="15" fill="#333333"/>
    <circle cx="150" cy="70" r="8" fill="#666666"/>
    <!-- Lights -->
    <rect x="20" y="45" width="10" height="10" rx="5" fill="#f1c40f"/>
    <rect x="170" y="45" width="10" height="10" rx="5" fill="#e74c3c"/>
  </g>
  
  <!-- Car 2 - SUV -->
  <g transform="translate(400, 370) scale(0.9)">
    <!-- Car body -->
    <rect x="20" y="40" width="180" height="35" rx="10" fill="#2ecc71"/>
    <rect x="35" y="5" width="150" height="35" rx="10" fill="#2ecc71"/>
    <!-- Windows -->
    <rect x="45" y="10" width="35" height="25" rx="5" fill="#d6eaf8"/>
    <rect x="90" y="10" width="35" height="25" rx="5" fill="#d6eaf8"/>
    <rect x="135" y="10" width="35" height="25" rx="5" fill="#d6eaf8"/>
    <!-- Wheels -->
    <circle cx="60" cy="75" r="18" fill="#333333"/>
    <circle cx="60" cy="75" r="10" fill="#666666"/>
    <circle cx="160" cy="75" r="18" fill="#333333"/>
    <circle cx="160" cy="75" r="10" fill="#666666"/>
    <!-- Lights -->
    <rect x="20" y="50" width="10" height="10" rx="5" fill="#f1c40f"/>
    <rect x="190" y="50" width="10" height="10" rx="5" fill="#e74c3c"/>
  </g>
  
  <!-- Car 3 - Truck -->
  <g transform="translate(580, 350) scale(0.75)">
    <!-- Truck body -->
    <rect x="20" y="40" width="80" height="40" rx="5" fill="#e74c3c"/>
    <rect x="100" y="40" width="120" height="60" rx="5" fill="#e74c3c"/>
    <rect x="30" y="10" width="60" height="30" rx="5" fill="#e74c3c"/>
    <!-- Windows -->
    <rect x="40" y="15" width="40" height="20" rx="5" fill="#d6eaf8"/>
    <!-- Wheels -->
    <circle cx="50" cy="80" r="20" fill="#333333"/>
    <circle cx="50" cy="80" r="12" fill="#666666"/>
    <circle cx="140" cy="100" r="20" fill="#333333"/>
    <circle cx="140" cy="100" r="12" fill="#666666"/>
    <circle cx="190" cy="100" r="20" fill="#333333"/>
    <circle cx="190" cy="100" r="12" fill="#666666"/>
    <!-- Lights -->
    <rect x="20" y="50" width="10" height="10" rx="5" fill="#f1c40f"/>
    <rect x="90" y="50" width="10" height="10" rx="5" fill="#e74c3c"/>
  </g>
  
  <!-- Buildings in background -->
  <rect x="150" y="150" width="80" height="250" fill="#3498db" opacity="0.7"/>
  <rect x="250" y="200" width="60" height="200" fill="#2ecc71" opacity="0.7"/>
  <rect x="330" y="180" width="70" height="220" fill="#e74c3c" opacity="0.7"/>
  <rect x="420" y="150" width="90" height="250" fill="#9b59b6" opacity="0.7"/>
  <rect x="530" y="220" width="50" height="180" fill="#f1c40f" opacity="0.7"/>
  <rect x="600" y="170" width="70" height="230" fill="#1abc9c" opacity="0.7"/>
  
  <!-- Windows on buildings -->
  <g fill="#ffffff" opacity="0.8">
    <!-- Building 1 windows -->
    <rect x="160" y="170" width="15" height="15"/>
    <rect x="185" y="170" width="15" height="15"/>
    <rect x="160" y="200" width="15" height="15"/>
    <rect x="185" y="200" width="15" height="15"/>
    <rect x="160" y="230" width="15" height="15"/>
    <rect x="185" y="230" width="15" height="15"/>
    <rect x="160" y="260" width="15" height="15"/>
    <rect x="185" y="260" width="15" height="15"/>
    <rect x="160" y="290" width="15" height="15"/>
    <rect x="185" y="290" width="15" height="15"/>
    <rect x="160" y="320" width="15" height="15"/>
    <rect x="185" y="320" width="15" height="15"/>
    <rect x="160" y="350" width="15" height="15"/>
    <rect x="185" y="350" width="15" height="15"/>
    
    <!-- Other buildings windows (simplified) -->
    <rect x="260" y="220" width="40" height="10"/>
    <rect x="260" y="240" width="40" height="10"/>
    <rect x="260" y="260" width="40" height="10"/>
    <rect x="260" y="280" width="40" height="10"/>
    <rect x="260" y="300" width="40" height="10"/>
    <rect x="260" y="320" width="40" height="10"/>
    <rect x="260" y="340" width="40" height="10"/>
    <rect x="260" y="360" width="40" height="10"/>
    
    <rect x="340" y="200" width="50" height="10"/>
    <rect x="340" y="220" width="50" height="10"/>
    <rect x="340" y="240" width="50" height="10"/>
    <rect x="340" y="260" width="50" height="10"/>
    <rect x="340" y="280" width="50" height="10"/>
    <rect x="340" y="300" width="50" height="10"/>
    <rect x="340" y="320" width="50" height="10"/>
    <rect x="340" y="340" width="50" height="10"/>
    <rect x="340" y="360" width="50" height="10"/>
    
    <rect x="430" y="170" width="70" height="10"/>
    <rect x="430" y="190" width="70" height="10"/>
    <rect x="430" y="210" width="70" height="10"/>
    <rect x="430" y="230" width="70" height="10"/>
    <rect x="430" y="250" width="70" height="10"/>
    <rect x="430" y="270" width="70" height="10"/>
    <rect x="430" y="290" width="70" height="10"/>
    <rect x="430" y="310" width="70" height="10"/>
    <rect x="430" y="330" width="70" height="10"/>
    <rect x="430" y="350" width="70" height="10"/>
    <rect x="430" y="370" width="70" height="10"/>
    
    <rect x="540" y="240" width="30" height="10"/>
    <rect x="540" y="260" width="30" height="10"/>
    <rect x="540" y="280" width="30" height="10"/>
    <rect x="540" y="300" width="30" height="10"/>
    <rect x="540" y="320" width="30" height="10"/>
    <rect x="540" y="340" width="30" height="10"/>
    <rect x="540" y="360" width="30" height="10"/>
    
    <rect x="610" y="190" width="50" height="10"/>
    <rect x="610" y="210" width="50" height="10"/>
    <rect x="610" y="230" width="50" height="10"/>
    <rect x="610" y="250" width="50" height="10"/>
    <rect x="610" y="270" width="50" height="10"/>
    <rect x="610" y="290" width="50" height="10"/>
    <rect x="610" y="310" width="50" height="10"/>
    <rect x="610" y="330" width="50" height="10"/>
    <rect x="610" y="350" width="50" height="10"/>
  </g>
  
  <!-- Sun -->
  <circle cx="100" cy="100" r="40" fill="#f1c40f"/>
  <circle cx="100" cy="100" r="30" fill="#f39c12"/>
  
  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="200" cy="120" rx="40" ry="20"/>
    <ellipse cx="230" cy="110" rx="30" ry="25"/>
    <ellipse cx="260" cy="125" rx="35" ry="15"/>
    
    <ellipse cx="500" cy="80" rx="50" ry="25"/>
    <ellipse cx="540" cy="70" rx="40" ry="30"/>
    <ellipse cx="580" cy="85" rx="45" ry="20"/>
  </g>
</svg>
