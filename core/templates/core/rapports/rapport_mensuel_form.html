{% extends 'core/form_base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
            <h6 class="m-0 font-weight-bold text-primary">{{ title }}</h6>
        </div>
        <div class="card-body">
            <!-- Temporairement commenté car la route n'existe pas encore -->
            <!-- <form method="get" action="{% url 'rapport_mensuel_consommation' %}"> -->
            <form method="get" action="#">
                <div class="form-group row">
                    <label for="dotation_id" class="col-sm-3 col-form-label">Dotation (Achat stock carburant HT):</label>
                    <div class="col-sm-9">
                        <select name="dotation_id" id="dotation_id" class="form-control" required>
                            <option value="">Sélectionnez une dotation</option>
                            {% for dotation in dotations %}
                                <option value="{{ dotation.id_achat_stock_carburant_ht }}">{{ dotation.libelle }} - {{ dotation.date_achat|date:"d/m/Y" }} ({{ dotation.voucher }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="mois" class="col-sm-3 col-form-label">Mois:</label>
                    <div class="col-sm-9">
                        <select name="mois" id="mois" class="form-control" required>
                            <option value="">Sélectionnez un mois</option>
                            {% for mois in mois_options %}
                                <option value="{{ mois.value }}">{{ mois.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="annee" class="col-sm-3 col-form-label">Année:</label>
                    <div class="col-sm-9">
                        <select name="annee" id="annee" class="form-control" required>
                            <option value="">Sélectionnez une année</option>
                            {% for annee in annees_options %}
                                <option value="{{ annee.value }}">{{ annee.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-sm-9 offset-sm-3">
                        <button type="submit" class="btn btn-primary">Générer le rapport</button>
                        <button type="submit" name="format" value="pdf" class="btn btn-secondary">Exporter en PDF</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
