{% extends 'core/form_base.html' %}
{% block title %}Supprimer la demande de course{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Supprimer la demande de course</h2>
    <p>Êtes-vous sûr de vouloir supprimer cette demande de course ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
        <a href="{% url 'demandes_course_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
