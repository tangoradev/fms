{% extends 'core/base.html' %}

{% block title %}Modifier statut véhicule{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
  <div class="card shadow-sm">
    <div class="card-header"><h5 class="mb-0">Changer le statut - {{ vehicule.immatriculation }}</h5></div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Nouveau statut</label>
          {{ form.statut }}
          {% if form.statut.errors %}<div class="text-danger small">{{ form.statut.errors }}</div>{% endif %}
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{% url 'vehicule_detail' vehicule.pk %}" class="btn btn-outline-secondary">Annuler</a>
          <button class="btn btn-primary" type="submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
